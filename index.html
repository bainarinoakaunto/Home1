<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>[公式]RYO15542（バイナリ）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#d3d3d3;
  color:#333;
}

/* 起動画面 */
#boot {
  position:fixed;
  width:100%;
  height:100%;
  background:#000;
  color:#00ff9c;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:monospace;
  z-index:9999;
  text-align:center;
}

#bootText {
  margin-top:10px;
  font-size:16px;
  animation: blink 1s infinite;
}

#bootFinal {
  margin-top:20px;
  font-size:14px;
  opacity:0;
  animation: showFinal 2s forwards;
  animation-delay:2s;
}

@keyframes blink {
  50% { opacity:0.3; }
}

@keyframes showFinal {
  to { opacity:0.8; }
}

/* ナビ */
nav {
  background:#444;
  padding:15px;
  text-align:center;
}
nav a {
  color:#fff;
  margin:0 15px;
  text-decoration:none;
}

/* ページ */
.page {
  display:none;
  padding:50px;
  text-align:center;
}
.page.active {
  display:block;
}

/* ボックス */
.box {
  background:#fff;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* ボタン */
.button {
  display:inline-block;
  margin-top:15px;
  padding:10px 20px;
  background:#555;
  color:#fff;
  text-decoration:none;
  border-radius:5px;
}
.button:hover {
  background:#333;
}
</style>

<script>
window.onload = function(){
  let text = "01010110 01001001 01001110 01000001 01010010 01011001";
  let i = 0;

  let interval = setInterval(function(){
    document.getElementById("bootText").innerText = text.substring(0, i);
    i++;

    if(i > text.length){
      clearInterval(interval);

      setTimeout(function(){
        document.getElementById("boot").style.display = "none";
        document.getElementById("home").classList.add("active");
      }, 1200);
    }
  }, 40);
};

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</head>

<body>

<!-- 起動画面 -->
<div id="boot">
  <div>BOOTING SYSTEM...</div>

  <div id="bootText"></div>

  <!-- 出力結果 -->
  <div id="bootFinal">
    >> OUTPUT: バイナリ（ryo15542）公式サイト
  </div>
</div>

<!-- ナビ -->
<nav>
  <a href="#" onclick="showPage('home')">ホーム</a>
  <a href="#" onclick="showPage('info')">更新情報</a>
  <a href="#" onclick="showPage('contact')">お問い合わせ</a>
</nav>

<!-- ホーム -->
<div id="home" class="page active">
  <h1>RYO15542</h1>

  <div class="box">
    <img src="main.jpg" alt="メイン画像">
    <p>個人ホームページへようこそ。</p>

    <a class="button" href="https://ryo15542.blog.jp" target="_blank">
      ▶ ブログを見る
    </a>
  </div>
</div>

<!-- フログ情報 -->
<div id="info" class="page">
  <h1>更新情報</h1>

  <div class="box">
    <p>更新ログ・記録をまとめています。</p>
  </div>
</div>
<div class="box">
  <h2>更新ログ</h2>

  <p>2026/04/25 - 新規サイト公開</p>
  <p>2026/04/24 - ブログ「メモリーカード」を投稿</p>
</div>
<!-- お問い合わせ -->
<div id="contact" class="page">
  <h1>お問い合わせ</h1>

  <div class="box">
 <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdBnkiE4LR3LHIt72-LibEUVVjJISLXa2_IbmGOtWML3My13w/viewform?embedded=true" width="640" height="763" frameborder="0" marginheight="0" marginwidth="0">読み込んでいます…</iframe>
  </div>
</div>

</body>
</html>
